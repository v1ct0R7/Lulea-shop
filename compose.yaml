services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 4000
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - lulea-data:/app/server/data
      - lulea-uploads:/app/server/uploads

volumes:
  lulea-data:
    external: true
  lulea-uploads:
    external: true
